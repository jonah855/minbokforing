name: Test Min Bokföring

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app.py features.py run.py
      - name: Import app and features
        run: python -c "import app; from features import register_features; register_features(app.app, app.conn, app.setting, app.set_setting, app.create_voucher, app.money, app.AC, app.ROOT, app.EXPORT); print('IMPORT_OK')"
      - name: Flask smoke test
        run: |
          python - <<'PY'
          import app
          from features import register_features
          register_features(app.app, app.conn, app.setting, app.set_setting, app.create_voucher, app.money, app.AC, app.ROOT, app.EXPORT)
          client = app.app.test_client()
          paths = ['/', '/customers', '/articles', '/invoices', '/quotes']
          for path in paths:
              response = client.get(path)
              print(path, response.status_code)
              assert response.status_code < 500, f'{path} returned {response.status_code}'
          print('SMOKE_TEST_OK')
          PY
