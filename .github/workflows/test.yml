name: Test Min Bokföring

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app.py features.py invoice_upgrade.py invoice_hardening.py invoice_payment_upgrade.py invoice_pdf_fix.py invoice_customer_fix.py nav_upgrade.py ui_consistency.py run.py
      - name: Import full application
        run: |
          python - <<'PY'
          import app
          from features import register_features
          from invoice_upgrade import register_invoice_upgrade
          from invoice_hardening import register_invoice_hardening
          from invoice_payment_upgrade import register_invoice_payment_upgrade
          from invoice_pdf_fix import register_invoice_pdf_fix
          from invoice_customer_fix import register_invoice_customer_fix
          from nav_upgrade import register_navigation_upgrade
          from ui_consistency import register_ui_consistency
          register_features(app.app, app.conn, app.setting, app.set_setting, app.create_voucher, app.money, app.AC, app.ROOT, app.EXPORT)
          register_invoice_upgrade(app.app, app.conn, app.setting, app.set_setting, app.create_voucher, app.money, app.AC, app.ROOT, app.EXPORT)
          register_invoice_hardening(app.app, app.conn, app.setting, app.EXPORT)
          register_invoice_payment_upgrade(app.app, app.conn, app.setting, app.set_setting, app.create_voucher, app.money, app.AC, app.ROOT, app.EXPORT)
          register_invoice_pdf_fix(app.app, app.conn, app.setting, app.EXPORT)
          register_invoice_customer_fix(app.app, app.conn)
          register_navigation_upgrade()
          register_ui_consistency(app.app)
          print('IMPORT_OK')
          PY
      - name: Flask smoke, invoice, payment and UI consistency test
        run: |
          python - <<'PY'
          import app, json
          from features import register_features
          from invoice_upgrade import register_invoice_upgrade
          from invoice_hardening import register_invoice_hardening
          from invoice_payment_upgrade import register_invoice_payment_upgrade
          from invoice_pdf_fix import register_invoice_pdf_fix
          from invoice_customer_fix import register_invoice_customer_fix
          from nav_upgrade import register_navigation_upgrade
          from ui_consistency import register_ui_consistency
          register_features(app.app, app.conn, app.setting, app.set_setting, app.create_voucher, app.money, app.AC, app.ROOT, app.EXPORT)
          register_invoice_upgrade(app.app, app.conn, app.setting, app.set_setting, app.create_voucher, app.money, app.AC, app.ROOT, app.EXPORT)
          register_invoice_hardening(app.app, app.conn, app.setting, app.EXPORT)
          register_invoice_payment_upgrade(app.app, app.conn, app.setting, app.set_setting, app.create_voucher, app.money, app.AC, app.ROOT, app.EXPORT)
          register_invoice_pdf_fix(app.app, app.conn, app.setting, app.EXPORT)
          register_invoice_customer_fix(app.app, app.conn)
          register_navigation_upgrade()
          register_ui_consistency(app.app)
          client = app.app.test_client()
          for path in ['/', '/customers', '/articles', '/invoices', '/quotes', '/invoice-settings', '/invoices/new', '/invoice-payments']:
              response = client.get(path)
              print(path, response.status_code)
              assert response.status_code < 500, f'{path} returned {response.status_code}'
              if 'text/html' in response.content_type:
                  assert 'minbokforing-consistent-ui' in response.get_data(as_text=True), f'{path} missing unified UI theme'
          for k, v in {'company_name':'Testfirma','company_vat':'SE123456789001','company_address':'Testgatan 1','company_zip':'302 00','company_city':'Halmstad','accounting_method':'cash'}.items():
              app.set_setting(k, v)
          r = client.post('/customers', data={'name':'Testkund AB','orgnr':'5560000000','address':'Kundgatan 2','zip':'302 10','city':'Halmstad'}, follow_redirects=False)
          assert r.status_code in (302, 303)
          customer_id = app.conn().execute('SELECT id FROM customers ORDER BY id DESC LIMIT 1').fetchone()['id']
          lines = [{'description':'Testtjänst','quantity':2,'unit':'st','price_ex_vat':100,'vat_rate':25,'discount':0}]
          r = client.post('/invoices/new', data={'customer_id':customer_id,'invoice_date':'2026-09-11','delivery_date':'2026-09-11','due_date':'2026-10-11','payment_terms_days':'30','currency':'SEK','buyer_vat_no':'','lines_json':json.dumps(lines),'notes':'Test'}, follow_redirects=False)
          assert r.status_code in (302, 303)
          invoice_id = app.conn().execute('SELECT id FROM invoices ORDER BY id DESC LIMIT 1').fetchone()['id']
          invoice = app.conn().execute('SELECT * FROM invoices WHERE id=?',(invoice_id,)).fetchone()
          assert round(invoice['total'],2) == 250.00
          assert client.get(f'/invoice/{invoice_id}').status_code == 200
          pdf = client.get(f'/invoice/{invoice_id}.pdf'); assert pdf.status_code == 200 and pdf.mimetype == 'application/pdf'; assert pdf.data.startswith(b'%PDF-') and len(pdf.data) > 1000
          new_customer = {'name':'Ny Kund Test','orgnr':'5599999999','vat_no':'SE559999999901','address':'Ny kundgatan 3','zip':'302 20','city':'Halmstad','email':'nykund@example.com','phone':'0700000000'}
          r = client.post('/invoice/create-customer-inline', json=new_customer)
          assert r.status_code == 200 and r.json['ok']
          inline_id = r.json['id']
          inline = app.conn().execute('SELECT * FROM customers WHERE id=?',(inline_id,)).fetchone()
          assert inline['name']=='Ny Kund Test' and inline['address']=='Ny kundgatan 3' and inline['city']=='Halmstad'
          assert client.get('/invoices/new').status_code == 200
          r = client.post(f'/invoice/{invoice_id}/issue', follow_redirects=False); assert r.status_code in (302, 303)
          c=app.conn()
          c.execute("INSERT INTO transactions(tx_key,date,reference,description,amount,balance,currency,source,status,suggested_account,suggested_vat,raw) VALUES(?,?,?,?,?,?,?,?,?,?,?,?)",('TESTPAY','2026-09-20',str(invoice['number']),'Betalning faktura',250.0,250.0,'SEK','TEST','new','1930','', ''))
          tid=c.execute('SELECT last_insert_rowid() id').fetchone()['id']; c.commit()
          assert client.get(f'/invoice/{invoice_id}/match-payment').status_code == 200
          r=client.post(f'/invoice/{invoice_id}/match-payment',data={'transaction_id':tid},follow_redirects=False); assert r.status_code in (302,303)
          row=c.execute('SELECT status FROM invoices WHERE id=?',(invoice_id,)).fetchone(); assert row['status']=='paid'
          match=c.execute('SELECT voucher_id FROM invoice_payment_matches WHERE transaction_id=?',(tid,)).fetchone(); assert match and match['voucher_id']
          tx=c.execute('SELECT status,voucher_id FROM transactions WHERE id=?',(tid,)).fetchone(); assert tx['status']=='booked' and tx['voucher_id']==match['voucher_id']
          assert client.get('/invoice-payments').status_code == 200
          print('INLINE_CUSTOMER_TEST_OK')
          print('PDF_TEST_OK')
          print('INVOICE_PAYMENT_TEST_OK')
          print('UI_CONSISTENCY_TEST_OK')
          print('SMOKE_TEST_OK')
          PY
